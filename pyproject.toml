[project]
name = "lightsout"
version = "0.1.0"
description = "Compile any Formula 1 race into a shareable browser replay, with undercuts and key moments detected automatically."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lightsout = "lightsout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lightsout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
